version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: tobok_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: tobok_api
    env_file:
      - .env
    ports:
      - "${SPRING_PORT}:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: